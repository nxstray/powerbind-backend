global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alert rules — files under /etc/prometheus/rules (mounted read-only from
# ./monitoring/prometheus/rules). No Alertmanager is wired yet, so firing
# alerts surface in the Prometheus UI (/alerts) and /api/v1/alerts.
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: 'powerbind-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      # nama "backend" = nama service di docker-compose.yml, bukan localhost,
      # karena prometheus jalan di container terpisah dalam network yang sama
      #- targets: ['backend:8045']
      - targets: ['host.docker.internal:8045']
