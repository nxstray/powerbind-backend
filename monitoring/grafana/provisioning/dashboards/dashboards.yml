# Dashboard provider — loads every dashboard JSON under ../dashboards on startup
# and keeps them in sync (files are the source of truth; edits made in the Grafana
# UI are overwritten on restart, which is exactly what we want for "dashboards as
# code"). Mount both folders via docker-compose (see the grafana service).
apiVersion: 1

providers:
  - name: powerbind
    orgId: 1
    folder: PowerBind
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
