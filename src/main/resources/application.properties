spring.config.import=optional:file:.env[.properties]

# Server
server.port=8045

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/powerbind
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway — migrations run manually via pgAdmin4, disabled on startup
spring.flyway.enabled=true

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# MQTT (Mosquitto broker)
mqtt.broker-url=${MQTT_BROKER_URL:tcp://localhost:1883}
mqtt.client-id=powerbind-backend
mqtt.topic.presence=smart-home/presence/#
mqtt.topic.power=smart-home/power/#

# InfluxDB
influxdb.url=${INFLUXDB_URL:http://localhost:8086}
influxdb.token=${INFLUXDB_TOKEN}
influxdb.org=${INFLUXDB_ORG:powerbind}
influxdb.bucket=${INFLUXDB_BUCKET:smarthome}

# Groq AI
groq.api.url=https://api.groq.com/openai/v1/
groq.api.key=${GROQ_API_KEY}
groq.model=openai/gpt-oss-120b
groq.vision.model=qwen/qwen3.6-27b
groq.whisper.model=whisper-large-v3-turbo
groq.max-tokens=${GROQ_MAX_TOKENS:1024}

# Prometheus HTTP API — used by AdminMetricsController to proxy metric graph
# queries to the admin Metrics page. In docker-compose set PROMETHEUS_BASE_URL
# = http://prometheus:9090 (service name, same network as the backend).
prometheus.base-url=${PROMETHEUS_BASE_URL:http://localhost:9090}

# Resilience4j — only for calls to external systems (Groq API).
# CircuitBreaker: if >50% of the last 10 calls fail, the circuit opens
# for 30 seconds — subsequent requests are rejected immediately without waiting
# for a timeout, preventing the thread pool from being exhausted while Groq is slow/down.
resilience4j.circuitbreaker.instances.groq.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.groq.sliding-window-size=10
resilience4j.circuitbreaker.instances.groq.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.groq.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.groq.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.groq.permitted-number-of-calls-in-half-open-state=3
# Retry: 2 retries with exponential backoff (500ms, 1000ms) —
# only for transient exceptions (timeout/connection), not HTTP 4xx.
resilience4j.retry.instances.groq.max-attempts=3
resilience4j.retry.instances.groq.wait-duration=500ms
resilience4j.retry.instances.groq.enable-exponential-backoff=true
resilience4j.retry.instances.groq.exponential-backoff-multiplier=2

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Rate limiting
rate.limit.max-requests=30
rate.limit.window-seconds=60

# Login lockout — 5 failed attempts = 10 minutes lockout
login.max-attempts=5
login.lockout-minutes=10

# WebSocket
spring.websocket.enabled=true

# Actuator — "prometheus" + "metrics" added so the /actuator/prometheus
# endpoint is active and can be scraped by Prometheus
management.endpoints.web.exposure.include=health,prometheus,metrics
management.endpoint.health.show-details=never
management.metrics.tags.application=powerbind-backend

# Default user — created by DataInitializer on first startup
app.default-user.username=${APP_DEFAULT_USER_USERNAME:admin}
app.default-user.password=${APP_DEFAULT_USER_PASSWORD:}

app.family-users=${APP_FAMILY_USERS:}

# Loki (for AdminLogController — merged Backend/Frontend/IoT log proxy)
loki.url=${LOKI_URL:http://localhost:3100}
