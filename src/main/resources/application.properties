# Server
server.port=8045

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/powerbind
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway — migrations run manually via pgAdmin4, disabled on startup
spring.flyway.enabled=false

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# MQTT (Mosquitto broker)
mqtt.broker-url=${MQTT_BROKER_URL:tcp://localhost:1883}
mqtt.client-id=powerbind-backend
mqtt.topic.presence=smart-home/presence
mqtt.topic.power=smart-home/power

# InfluxDB
influxdb.url=${INFLUXDB_URL:http://localhost:8086}
influxdb.token=${INFLUXDB_TOKEN}
influxdb.org=${INFLUXDB_ORG:powerbind}
influxdb.bucket=${INFLUXDB_BUCKET:smarthome}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Rate limiting
rate.limit.max-requests=30
rate.limit.window-seconds=60

# Login lockout — 5 failed attempts = 10 minutes lockout
login.max-attempts=5
login.lockout-minutes=10

# WebSocket
spring.websocket.enabled=true

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
