# Test profile — uses H2 in-memory database, disables MQTT and InfluxDB
server.port=0

# H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Disable Flyway during tests — JPA creates schema directly
spring.flyway.enabled=false

# Disable Spring Integration (MQTT) and Redis auto-configuration during tests
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.integration.IntegrationAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000
jwt.refresh-expiration=604800000

# MQTT — dummy values, beans disabled via exclude above
mqtt.broker-url=tcp://localhost:1883
mqtt.client-id=powerbind-test
mqtt.topic.presence=smart-home/presence
mqtt.topic.power=smart-home/power

# InfluxDB — dummy values, will not connect during tests
influxdb.url=http://localhost:8086
influxdb.token=test-token
influxdb.org=test-org
influxdb.bucket=test-bucket

# CORS
cors.allowed-origins=http://localhost:5173

# Login lockout
login.max-attempts=5
login.lockout-minutes=10

# Silence noisy logs during tests
logging.level.root=WARN
logging.level.com.powerbind=INFO