# Test profile — uses H2 in-memory database, disables MQTT and InfluxDB
server.port=0

# H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Disable Flyway during tests — JPA creates schema directly
spring.flyway.enabled=false

# Disable MQTT auto-connect during tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.integration.IntegrationAutoConfiguration

# JWT
jwt.secret=test-secret-key-that-is-long-enough-for-hmac-sha256-algorithm
jwt.expiration=3600000
jwt.refresh-expiration=604800000

# Redis — disabled for tests, use embedded or mock
spring.data.redis.host=localhost
spring.data.redis.port=6379

# CORS
cors.allowed-origins=http://localhost:5173

# Login lockout
login.max-attempts=5
login.lockout-minutes=10

# Silence noisy logs during tests
logging.level.root=WARN
logging.level.com.powerbind=INFO
