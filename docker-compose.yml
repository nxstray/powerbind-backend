# Usage:
#   1. Copy this file into the backend repo root (replacing the old
#      docker-compose.yml — its content (loki + grafana) is preserved below).
#   2. Create a `.env` file in the backend repo root with the variables below
#      (see SETUP.md for the full list).
#   3. Run: docker compose up -d --build
#
# Startup order note: `depends_on` here only guarantees container *start*
# order, not that Postgres/Redis/etc. are actually ready to accept
# connections yet. If the backend fails to connect on first boot, just run
# `docker compose restart backend` once more.

services:
  # ── Database & supporting infra ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: powerbind-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=powerbind
      - POSTGRES_USER=${DB_USERNAME:-powerbind}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    ports:
      # host 5433: native Postgres (dev) is still listening on 5432
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-powerbind}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: powerbind-redis
    restart: unless-stopped
    ports:
      # host 6380: standalone redis (dev) is still listening on 6379
      - "6380:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: powerbind-mosquitto
    restart: unless-stopped
    environment:
      # entrypoint.sh generates password_file + acl_file from these on every
      # start — anonymous clients are rejected (allow_anonymous false).
      - MQTT_BACKEND_USERNAME=${MQTT_BACKEND_USERNAME:-powerbind-backend}
      - MQTT_BACKEND_PASSWORD=${MQTT_BACKEND_PASSWORD:?MQTT_BACKEND_PASSWORD must be set in .env}
      - MQTT_DEVICE_USERS=${MQTT_DEVICE_USERS:-}
    # custom entrypoint: generate credentials/ACL first, then start the broker
    # (the image's own docker-entrypoint.sh is invoked at the end of it)
    entrypoint: ["/bin/sh", "/mosquitto/entrypoint.sh"]
    ports:
      # host 1884: native Mosquitto service is still listening on 1883
      - "1884:1883"
      # MQTT over TLS — only active after .\run-mosquitto-certs.ps1
      - "8883:8883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/entrypoint.sh:/mosquitto/entrypoint.sh:ro
      # generated by run-mosquitto-certs.ps1 (gitignored); mounted so the
      # entrypoint can enable listener 8883 when the certs are present
      - ./mosquitto/certs:/mosquitto/config/certs:ro
      - mosquitto-data:/mosquitto/data

  influxdb:
    image: influxdb:2.7
    container_name: powerbind-influxdb
    restart: unless-stopped
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_ADMIN_USER:-admin}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_ADMIN_PASSWORD:?INFLUXDB_ADMIN_PASSWORD must be set in .env}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG:-powerbind}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET:-smarthome}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN:?INFLUXDB_TOKEN must be set in .env}
    ports:
      # host 8087: native InfluxDB (dev) is still listening on 8086
      - "8087:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
    healthcheck:
      # CLI `influx` sudah terpasang di image; ping exit 0 hanya saat
      # influxd merespons. start_period ditambah karena boot pertama
      # menjalankan setup organisasi/bucket.
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Backup terjadwal Postgres + InfluxDB ────────────────────────────────
  # Cron di dalam container (default: tiap hari 02:00, ubah via BACKUP_CRON)
  # menjalankan pg_dump + influx backup ke ./backups di host; file lebih tua
  # dari BACKUP_RETENTION_DAYS (default 7 hari) dirotasi otomatis.
  # Jalankan manual: docker compose exec backup /usr/local/bin/backup.sh
  # Lihat log:      docker compose exec backup tail -20 /var/log/backup.log
  backup:
    build:
      context: ./backup
    container_name: powerbind-backup
    restart: unless-stopped
    environment:
      - DB_USERNAME=${DB_USERNAME:-powerbind}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      - POSTGRES_DB=powerbind
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:?INFLUXDB_TOKEN must be set in .env}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-powerbind}
      - BACKUP_CRON=${BACKUP_CRON:-0 2 * * *}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_healthy

  # ── Observability (existing logs + new metrics) ─────────────────────────
  loki:
    image: grafana/loki:2.9.0
    container_name: powerbind-loki
    restart: unless-stopped
    ports:
      - "3100:3100"

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: powerbind-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    # The backend runs as the "backend" service on the same network, so the
    # scrape target in prometheus.yml uses the service name, not localhost.

  grafana:
    image: grafana/grafana:10.2.0
    container_name: powerbind-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      # Dashboards as code — provisioned on startup from these read-only mounts
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki

  # ── Code QA (SonarQube Community — free) ─────────────────────────────────
  # UI: http://localhost:9000 (default login admin/admin, changed on first boot).
  # Community image, actively maintained (9.9 LTS is EOL — upgrade per SonarSource
  # notice).
  #
  # Keeps SonarQube on its embedded H2 database (`sonar-data/sonar.mv.db`) — that is
  # where the existing projects, users, tokens and admin password live. Pointing
  # SonarQube at a *different* (empty) database makes it initialise a fresh schema,
  # which silently loses every project and resets the admin login to admin/admin.
  # To move to Postgres later use SonarSource's H2 -> Postgres migration tool —
  # never just swap SONAR_JDBC_URL.
  sonarqube:
    image: sonarqube:community
    container_name: powerbind-sonarqube
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions

  # ── Application ──────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: powerbind-backend
    restart: unless-stopped
    ports:
      - "8045:8045"
    environment:
      - DB_USERNAME=${DB_USERNAME:-powerbind}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/powerbind
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MQTT_BROKER_URL=tcp://mosquitto:1883
      # Broker credentials — mosquitto runs with allow_anonymous=false;
      # entrypoint.sh of the mosquitto service builds password_file from
      # these same .env values (MQTT_BACKEND_*).
      - MQTT_USERNAME=${MQTT_BACKEND_USERNAME:-powerbind-backend}
      - MQTT_PASSWORD=${MQTT_BACKEND_PASSWORD:?MQTT_BACKEND_PASSWORD must be set in .env}
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:?INFLUXDB_TOKEN must be set in .env}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-powerbind}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-smarthome}
      # Inside the compose network the backend must reach Prometheus by SERVICE
      # NAME — its own "localhost" is the backend container, not Prometheus
      # (the default in application.properties only works when the backend runs
      # on the host via `mvn spring-boot:run`).
      - PROMETHEUS_BASE_URL=http://prometheus:9090
      # Base URL only (no path) — matches logback-spring.xml and
      # AdminLogController, which each append their own API path
      - LOKI_URL=http://loki:3100
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      - GROQ_API_KEY=${GROQ_API_KEY:?GROQ_API_KEY must be set in .env}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      - APP_DEFAULT_USER_USERNAME=${APP_DEFAULT_USER_USERNAME:-admin}
      - APP_DEFAULT_USER_PASSWORD=${APP_DEFAULT_USER_PASSWORD:?APP_DEFAULT_USER_PASSWORD must be set in .env}
    healthcheck:
      # busybox wget bawaan image alpine; actuator /health membalas 503
      # saat status != UP, sehingga wget exit != 0. start_period menutup
      # waktu start JVM + Flyway.
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8045/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_started
      influxdb:
        condition: service_healthy
      loki:
        condition: service_started

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8045}
    container_name: powerbind-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

  # ── TLS reverse proxy ──────────────────────────────────────────────────────
  # Single HTTPS entry point in front of frontend + backend.
  # SITE_ADDRESS=localhost -> Caddy internal CA (self-signed, browser warning)
  # SITE_ADDRESS=example.com -> automatic Let's Encrypt (needs 80/443 open).
  caddy:
    image: caddy:2
    container_name: powerbind-caddy
    restart: unless-stopped
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
      - frontend

volumes:
  postgres-data:
  influxdb-data:
  prometheus-data:
  grafana-data:
  mosquitto-data:
  sonar-data:
  sonar-extensions:
  caddy-data:
  caddy-config: