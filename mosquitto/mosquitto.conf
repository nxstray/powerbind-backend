# Powerbind Mosquitto broker — hardened config (production-ready).
#
# Security:
#   - allow_anonymous false  : every client must authenticate with username/password
#   - password_file          : generated at container start by entrypoint.sh from .env
#   - acl_file               : per-user topic permissions, generated by entrypoint.sh
#   - TLS listener 8883      : enabled when certs exist (run run-mosquitto-certs.ps1)
#
# The passwd + acl files live in /mosquitto/config/ (generated, never committed).

listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/

# TLS listener — only added when run-mosquitto-certs.ps1 has generated certs
# and entrypoint.sh has written the tls-listener.conf include file.
include_dir /mosquitto/config/conf.d
