# CI: test + coverage, SBOM CycloneDX, SonarQube (opsional).
#
# Job build (test + SBOM) jalan di ubuntu-latest (GitHub-hosted).
# Job sonar jalan di runner SELF-HOSTED (powerbind-win, PC dev) karena
# SonarQube Server hanya ada di mesin ini (localhost:9000 tidak terjangkau
# dari runner cloud); kelas + report JaCoCo disampaikan lewat artifact.
#
# Secrets repo (Settings > Secrets and variables > Actions):
#   SONAR_HOST_URL - URL SonarQube Server (di mesin ini: http://localhost:9000)
#   SONAR_TOKEN    - token analisis dari SonarQube (My Account > Security).
#   Kosong = job sonar jalan tanpa analisis (step dilewati), build tetap jalan.
#
# JWT_SECRET / GROQ_API_KEY di bawah hanya DUMMY untuk context test (H2) -
# keduanya wajib resolve (application-test.properties + GroqService) dan
# runner tidak punya .env. JANGAN menaruh secret asli di file ini.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Redis dibutuhkan suite test: /actuator/health (ApplicationSmokeTest)
    # mengecek koneksi Redis di localhost:6379 — di mesin dev itu container
    # `redis` (6379:6379), di runner disediakan service container ini. Rate
    # limiter sendiri mati di profile test (RedisRateLimitFilter @Profile("!test")).
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # >= 32 byte: Keys.hmacShaKeyFor menolak key lebih pendek dari itu
      JWT_SECRET: ci-dummy-jwt-secret-0123456789abcdef0123456789abcdef0123456789abcdef
      GROQ_API_KEY: ci-dummy-groq-key
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # TANPA clean (konsisten dengan run-sonar-backend.ps1). JaCoCo report
      # (phase verify) dibutuhkan job sonar untuk coverage.
      - name: Test + JaCoCo coverage (mvn verify)
        run: mvn -B verify

      - name: SBOM (CycloneDX)
        run: mvn -B -q cyclonedx:makeBom

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/bom.json
          if-no-files-found: error

      # Kelas + report coverage untuk job sonar (self-hosted); cukup tiga
      # path ini saja, tidak perlu seluruh target/ (hemat storage artefak).
      - name: Upload build output for Sonar
        if: ${{ env.SONAR_HOST_URL != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: sonar-input
          path: |
            target/classes
            target/test-classes
            target/site/jacoco
          retention-days: 1

      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  # Analisis SonarQube di runner self-hosted (PC dev) — lihat header file.
  sonar:
    needs: build
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      # fetch-depth: 0 WAJIB: shallow clone membuat blame / new-code detection
      # salah (ditekankan di docs resmi SonarSource untuk GitHub Actions).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Tanpa setup-java: runner PC dev sudah membawa JDK 17 + Maven di PATH.
      - name: Download build output from job build
        if: ${{ env.SONAR_HOST_URL != '' }}
        uses: actions/download-artifact@v4
        with:
          name: sonar-input
          path: target

      # sonar.token (bukan sonar.login) - wajib untuk SonarQube Server
      # 2025.x+ / Community Build 26.9, sama seperti run-sonar-backend.ps1.
      # Sengaja tanpa shell bash: "bash" di mesin ini adalah WSL
      # (system32\bash.exe) yang mengartikan \ sebagai escape sehingga path
      # script sementara rusak. Shell = PowerShell 5.1 (pwsh tak terpasang);
      # tiap argumen -D WAJIB dikutip, kalau tidak PowerShell 5.1 memotong
      # "-Dsonar.host.url=..." jadi "-Dsonar" + ".host.url=..." dan Maven
      # gagal resolve plugin.
      - name: SonarQube analysis
        if: ${{ env.SONAR_HOST_URL != '' }}
        run: >-
          mvn -B sonar:sonar
          "-Dsonar.host.url=$env:SONAR_HOST_URL"
          "-Dsonar.token=$env:SONAR_TOKEN"
          "-Dsonar.projectKey=powerbind-backend"
          "-Dsonar.qualitygate.wait=true"